name = "calendar-mx"
compatibility_date = "2024-12-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "calendar_public"
database_id = "YOUR_PUBLIC_DB_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_ID"

[[kv_namespaces]]
binding = "TENANT_KV"
id = "YOUR_TENANT_KV_ID"

[vars]
APP_URL = "https://calendar.mx"
APP_DOMAIN = "calendar.mx"
